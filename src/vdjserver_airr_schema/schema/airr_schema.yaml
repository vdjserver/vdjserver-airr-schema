---

id: https://github.com/vdjserver/vdjserver-airr-schema

name: airr-schema

title: AIRR Standards Schema

description: LinkML representation of AIRR Standards for VDJServer data modeling.

prefixes:
  linkml: https://w3id.org/linkml/

default_range: string

imports:
  - linkml:types

classes:
  AIRRStandards:
    abstract: true
    description: An object directly converted from the AIRR schema.
  TimePoint:
    is_a: AIRRStandards
    description: Time point at which an observation or other action was performed.
    slots:
      - time_label
      - time_value
      - time_unit
  TimeInterval:
    is_a: AIRRStandards
    description: Time range or interval for a measurement, observation or action.
    slots:
      - time_min
      - time_max
      - time_unit
  PhysicalQuantity:
    is_a: AIRRStandards
    description: A physical quantity from a measurement or observation.
    slots:
      - physical_quantity
      - physical_unit
  TimeQuantity:
    is_a: AIRRStandards
    description: A time quantity
    slots:
      - time_quantity
      - time_unit
  Contributor:
    is_a: AIRRStandards
    description: Individual whose contribution to this work should be acknowledged
    slots:
      - contributor_id
      - name
      - orcid_id
      - affiliation
      - affiliation_department
      - contributions
  ContributorContribution:
    is_a: AIRRStandards
    description: Default ContributorContribution description
    slots:
      - role
      - degree
  RearrangedSequence:
    is_a: AIRRStandards
    description: 'Details of a directly observed rearranged sequence or an inference from rearranged sequences  contributing support for a gene or allele.

      '
    slots:
      - sequence_id
      - sequence
      - derivation
      - observation_type
      - curation
      - repository_name
      - repository_ref
      - deposited_version
      - sequence_start
      - sequence_end
  UnrearrangedSequence:
    is_a: AIRRStandards
    description: Details of an unrearranged sequence contributing support for a gene or allele
    slots:
      - sequence_id
      - sequence
      - curation
      - repository_name
      - repository_ref
      - patch_no
      - gff_seqid
      - gff_start
      - gff_end
      - strand
  SequenceDelineationV:
    is_a: AIRRStandards
    description: Delineation of a V-gene in a particular system
    slots:
      - sequence_delineation_id
      - delineation_scheme
      - unaligned_sequence
      - aligned_sequence
      - fwr1_start
      - fwr1_end
      - cdr1_start
      - cdr1_end
      - fwr2_start
      - fwr2_end
      - cdr2_start
      - cdr2_end
      - fwr3_start
      - fwr3_end
      - cdr3_start
      - alignment_labels
  AlleleDescription:
    is_a: AIRRStandards
    description: Details of a putative or confirmed Ig receptor gene/allele inferred from one or more observations
    slots:
      - allele_description_id
      - allele_description_ref
      - acknowledgements
      - release_version
      - release_date
      - release_description
      - label
      - sequence
      - coding_sequence
      - aliases
      - locus
      - chromosome
      - sequence_type
      - functional
      - inference_type
      - species
      - species_subgroup
      - species_subgroup_type
      - status
      - subgroup_designation
      - gene_designation
      - allele_designation
      - allele_similarity_cluster_designation
      - allele_similarity_cluster_member_id
      - j_codon_frame
      - gene_start
      - gene_end
      - utr_5_prime_start
      - utr_5_prime_end
      - leader_1_start
      - leader_1_end
      - leader_2_start
      - leader_2_end
      - v_rs_start
      - v_rs_end
      - d_rs_3_prime_start
      - d_rs_3_prime_end
      - d_rs_5_prime_start
      - d_rs_5_prime_end
      - j_cdr3_end
      - j_rs_start
      - j_rs_end
      - j_donor_splice
      - v_gene_delineations
      - unrearranged_support
      - rearranged_support
      - paralogs
      - curation
      - curational_tags
  GermlineSet:
    is_a: AIRRStandards
    description: 'A germline object set bringing together multiple AlleleDescriptions from the same strain or species.  All genes in a GermlineSet should be from a single locus.

      '
    slots:
      - germline_set_id
      - acknowledgements
      - release_version
      - release_description
      - release_date
      - germline_set_name
      - germline_set_ref
      - pub_ids
      - species
      - species_subgroup
      - species_subgroup_type
      - locus
      - allele_descriptions
      - curation
  GenotypeSet:
    is_a: AIRRStandards
    description: Default GenotypeSet description
    slots:
      - receptor_genotype_set_id
      - genotype_class_list
  Genotype:
    is_a: AIRRStandards
    description: Default Genotype description
    slots:
      - receptor_genotype_id
      - locus
      - documented_alleles
      - undocumented_alleles
      - deleted_genes
      - inference_process
  DocumentedAllele:
    is_a: AIRRStandards
    description: Default DocumentedAllele description
    slots:
      - label
      - germline_set_ref
      - phasing
  UndocumentedAllele:
    is_a: AIRRStandards
    description: Default UndocumentedAllele description
    slots:
      - allele_name
      - sequence
      - phasing
  DeletedGene:
    is_a: AIRRStandards
    description: Default DeletedGene description
    slots:
      - label
      - germline_set_ref
      - phasing
  MHCGenotypeSet:
    is_a: AIRRStandards
    description: Default MHCGenotypeSet description
    slots:
      - mhc_genotype_set_id
      - mhc_genotype_list
  MHCGenotype:
    is_a: AIRRStandards
