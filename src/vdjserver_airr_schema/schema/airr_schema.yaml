  repertoire_type:
    name: repertoire_type
    description: Repertoire type (source). Most often the type should be "observed," meaning it corresponds to an actual physical sample that was sequenced. Other allowed values are "simulated," i.e. the Rearrangements were generated in silico and there is no linked Subject/Sample metadata, and "inferred" for Rearrangements that are phylogenetically reconstructed from observed sequences. Inferred Repertoires should point to the same Subject/Sample metadata as the corresponding physical Repertoires.
