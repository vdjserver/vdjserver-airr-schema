    slots:
      - mhc_genotype_id
      - mhc_class
      - mhc_alleles
      - mhc_genotyping_method
  MHCAllele:
    is_a: AIRRStandards
    description: Default MHCAllele description
    slots:
      - allele_designation
      - gene
      - reference_set_ref
  Study:
    is_a: AIRRStandards
    description: Default Study description
    slots:
      - study_id
      - study_title
      - study_type
      - study_description
      - inclusion_exclusion_criteria
      - grants
      - contributors
      - pub_ids
      - keywords_study
      - adc_publish_date
      - adc_update_date
  SubjectGenotype:
    is_a: AIRRStandards
    description: Default SubjectGenotype description
    slots:
      - receptor_genotype_set
      - mhc_genotype_set
  Subject:
    is_a: AIRRStandards
    description: Default Subject description
    slots:
      - subject_id
      - synthetic
      - species
      - sex
      - age
      - age_event
      - ancestry_population
      - location_birth
      - ethnicity
      - race
      - strain_name
      - linked_subjects
      - link_type
      - diagnosis
      - genotype
  Diagnosis:
    is_a: AIRRStandards
    description: Default Diagnosis description
    slots:
      - study_group_description
      - diagnosis_timepoint
      - disease_diagnosis
      - disease_length
      - disease_stage
      - prior_therapies
      - immunogen
      - intervention
      - medical_history
  Sample:
    is_a: AIRRStandards
