    slots:
      - tissue_processing
      - cell_subset
      - cell_phenotype
      - cell_label
      - cell_species
      - single_cell
      - cell_number
      - cells_per_reaction
      - cell_storage
      - cell_quality
      - cell_isolation
      - cell_processing_protocol
  PCRTarget:
    is_a: AIRRStandards
    description: Default PCRTarget description
    slots:
      - pcr_target_locus
      - forward_pcr_primer_target_location
      - reverse_pcr_primer_target_location
  NucleicAcidProcessing:
    is_a: AIRRStandards
    description: Default NucleicAcidProcessing description
    slots:
      - template_class
      - template_quality
      - template_amount
      - library_generation_method
      - library_generation_protocol
      - library_generation_kit_version
      - pcr_target
      - complete_sequences
      - physical_linkage
  SequencingRun:
    is_a: AIRRStandards
    description: Default SequencingRun description
    slots:
      - sequencing_run_id
      - total_reads_passing_qc_filter
      - sequencing_platform
      - sequencing_facility
      - sequencing_run_date
      - sequencing_kit
      - sequencing_files
  SequencingData:
    is_a: AIRRStandards
    description: Default SequencingData description
    slots:
      - sequencing_data_id
      - file_type
      - filename
      - read_direction
      - read_length
      - paired_filename
      - paired_read_direction
      - paired_read_length
      - index_filename
      - index_length
  DataProcessing:
    is_a: AIRRStandards
    description: Default DataProcessing description
    slots:
      - data_processing_id
      - primary_annotation
      - software_versions
      - paired_reads_assembly
      - quality_thresholds
      - primer_match_cutoffs
      - collapsing_method
      - data_processing_protocols
      - data_processing_files
      - germline_database
      - germline_set_ref
      - analysis_provenance_id
  Repertoire:
    is_a: AIRRStandards
    description: Default Repertoire description
    slots:
      - repertoire_id
      - repertoire_name
      - repertoire_description
      - repertoire_type
      - study
      - subject
      - sample
      - data_processing
  RepertoireFilter:
    is_a: AIRRStandards
    description: Default RepertoireFilter description
    slots:
      - repertoire_id
      - repertoire_description
      - time_point
