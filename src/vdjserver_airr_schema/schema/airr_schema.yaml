    name: reactivity_id
    range: string
  reactivity_ref:
    name: reactivity_ref
    description: Comma separated list of CURIE identifiers of external reactivity records (e.g. IEDB_EPITOPE:1616345, https://https://www.iedb.org/epitope/1616345)  associated with this Rearrangement. Order and length of reactivity_id and reactivity_ref are independent.
    range: string
    annotations:
      nullable: true
  sample_processing_id:
    name: sample_processing_id
    range: string
    annotations:
      nullable: true
  rearrangement_type:
    name: rearrangement_type
    description: Rearrangement type (source). Most often the type should be "observed," meaning it corresponds to an actual physical sample that was sequenced. Other allowed values are "simulated," i.e. the Rearrangements were generated in silico and there is no linked Subject/Sample metadata, and "inferred" for Rearrangements that are phylogenetically reconstructed from observed sequences. Inferred Rearrangements should be assigned to a Repertoire with repertoire_type=inferred.
    slot_uri: rdf:type
    range: RearrangementTypeEnum
    annotations:
      nullable: true
  clone_class:
    name: clone_class
    description: Is this a single-chain clone or a cell-based clone?
    range: CloneClassEnum
    annotations:
      nullable: true
  nodes:
    name: nodes
    description: List of Nodes that are members of this clone.
    range: Node
    multivalued: true
    annotations:
      nullable: true
  inferred_ancestor:
    name: inferred_ancestor
    description: Node_id string that acts as a key to the Node record for the  inferred naive Rearrangement or Cell for this clone.
    range: string
    annotations:
      nullable: true
  clone_count:
    name: clone_count
    description: Absolute count of the size (number of members) of this clone in the repertoire. This could simply be the number of sequences (Rearrangement records) observed in this clone, the number of distinct cell barcodes (unique cell_id values), or a more sophisticated calculation appropriate to the experimental protocol. Absolute count is provided versus a frequency so that downstream analysis tools can perform their own normalization.
    range: integer
    annotations:
      nullable: true
  seed_id:
    name: seed_id
    description: sequence_id or cell_id of the seed sequence/cell. Empty string (or null) if there is no seed sequence.
    range: string
    annotations:
      nullable: true
  tree:
    name: tree
    description: Newick string describing the tree.
    range: string
    annotations:
      nullable: true
  node_id:
    name: node_id
    description: Identifier for the node.
    range: string
    annotations:
      nullable: false
  node_type:
    name: node_type
    description: Node type (source). "Observed" for rearrangements/cells that were observed in the source data, "inferred" for unobserved intermediates that were phylogenetically inferred, or "simulated" for simulated rearrangements/cells.
    slot_uri: rdf:type
    range: NodeTypeEnum
    annotations:
      nullable: true
  node_class:
    name: node_class
    description: Does this node contain a rearrangement of a cell?
    range: NodeClassEnum
    annotations:
      nullable: true
  receptors:
    name: receptors
    description: Array of receptor identifiers defined for the Receptor objects associated with this cell
    range: string
    multivalued: true
    annotations:
      nullable: true
  virtual_pairing:
    name: virtual_pairing
    description: boolean to indicate if pairing was inferred.
    range: boolean
    annotations:
      nullable: true
  cell_type:
    name: cell_type
    description: Cell type (source). Most often the type should be "observed," meaning it corresponds to an actual physical sample that was sequenced. Other allowed values are "simulated," i.e. the Cells were generated in silico and there is no linked Subject/Sample metadata, and "inferred" for Cells that are phylogenetically reconstructed from observed sequences. Inferred Cells should be assigned to a Repertoire with repertoire_type=inferred.
    slot_uri: rdf:type
    range: CellTypeEnum
    annotations:
      nullable: true
  expression_id:
    name: expression_id
    description: Identifier for the Expression object. This identifier must be unique within  a given study, but it is recommended that it be a universally unique record locator to enable database applications.
    range: string
    annotations:
      nullable: false
  property_type:
    name: property_type
    description: 'Keyword describing the property type and detection method used to measure the property value. The following keywords are recommended, but custom property types are also valid: "mrna_expression_by_read_count", "protein_expression_by_fluorescence_intensity", "antigen_bait_binding_by_fluorescence_intensity", "protein_expression_by_dna_barcode_count" and "antigen_bait_binding_by_dna_barcode_count".'
    slot_uri: rdf:type
    range: string
    annotations:
      nullable: false
  property:
    name: property
    description: Name of the property observed, typically a gene or antibody identifier (and label) from a  canonical resource such as Ensembl (e.g. ENSG00000275747, IGHV3-79) or  Antibody Registry (ABREG:1236456, Purified anti-mouse/rat/human CD27 antibody).
    range: string
  value:
    name: value
    description: Level at which the property was observed in the experiment (non-normalized).
    range: float
    annotations:
      nullable: true
  receptor_id:
    name: receptor_id
    description: Identifier for the Receptor object. This identifier must be unique within  a given study, but it is recommended that it be a universally unique record locator to enable database applications.
    range: string
    annotations:
      nullable: false
  receptor_hash:
    name: receptor_hash
    description: The SHA256 hash of the receptor amino acid sequence, calculated on the concatenated ``receptor_variable_domain_*_aa`` sequences and represented as base16-encoded string.
    range: string
    annotations:
      nullable: false
  receptor_type:
    name: receptor_type
    description: The top-level receptor type, either Immunoglobulin (Ig) or T Cell Receptor (TCR).
    slot_uri: rdf:type
    range: ReceptorTypeEnum
    annotations:
      nullable: false
  receptor_variable_domain_1_aa:
    name: receptor_variable_domain_1_aa
    description: Complete amino acid sequence of the mature variable domain of the Ig heavy, TCR beta or TCR delta chain. The mature variable domain is defined as encompassing all AA from and including first AA after the the signal peptide to and including the last AA that is completely encoded by the J gene.
    range: string
    annotations:
      nullable: false
  receptor_variable_domain_1_locus:
    name: receptor_variable_domain_1_locus
    description: Locus from which the variable domain in receptor_variable_domain_1_aa originates
    range: ReceptorVariableDomain1LocusEnum
    annotations:
      nullable: false
  receptor_variable_domain_2_aa:
    name: receptor_variable_domain_2_aa
    description: Complete amino acid sequence of the mature variable domain of the Ig light, TCR alpha or TCR gamma chain. The mature variable domain is defined as encompassing all AA from and including first AA after the the signal peptide to and including the last AA that is completely encoded by the J gene.
    range: string
    annotations:
      nullable: false
  receptor_variable_domain_2_locus:
    name: receptor_variable_domain_2_locus
    description: Locus from which the variable domain in receptor_variable_domain_2_aa originates
    range: ReceptorVariableDomain2LocusEnum
    annotations:
      nullable: false
  receptor_ref:
    name: receptor_ref
    description: Array of receptor identifiers defined for the Receptor object
    range: string
    multivalued: true
    annotations:
      nullable: true
  ligand_type:
    name: ligand_type
    description: Classification of ligand binding to the cell
    slot_uri: rdf:type
    range: LigandTypeEnum
    annotations:
      nullable: false
  antigen_type:
    name: antigen_type
    description: The type of antigen before processing by the immune system.
    slot_uri: rdf:type
    range: AntigenTypeEnum
    annotations:
      nullable: false
  antigen:
    name: antigen
    description: The substance against which the receptor was tested. This can be any substance that stimulates an adaptive immune response in the host, either through antibody production or by T cell activation after presentation via an MHC molecule.
    range: string
    annotations:
      nullable: false
  antigen_source_species:
    name: antigen_source_species
    description: The species from which the antigen was isolated
    range: AntigenSourceSpeciesOntology
    annotations:
      nullable: true
  peptide_start:
    name: peptide_start
    description: Start position of the peptide within the reference protein sequence
    range: integer
    annotations:
      nullable: true
  peptide_end:
    name: peptide_end
    description: End position of the peptide within the reference protein sequence
    range: integer
    annotations:
      nullable: true
  peptide_sequence_aa:
    name: peptide_sequence_aa
    description: The actual peptide sequence against which the receptor reactivity was measured. This field should be used as a convenience for antigens of antigen_type `protein` or `peptide`.
    range: string
    annotations:
      nullable: true
  mhc_gene_1:
    name: mhc_gene_1
    description: The MHC gene to which the mhc_allele_1 belongs
    range: MhcGene1Ontology
    annotations:
      nullable: true
  mhc_allele_1:
    name: mhc_allele_1
    description: Allele designation of the MHC alpha chain
    range: string
    annotations:
      nullable: true
  mhc_gene_2:
    name: mhc_gene_2
    description: The MHC gene to which the mhc_allele_2 belongs
    range: MhcGene2Ontology
    annotations:
      nullable: true
  mhc_allele_2:
    name: mhc_allele_2
    description: Allele designation of the MHC class II beta chain or the invariant beta2-microglobin chain
    range: string
    annotations:
      nullable: true
  reactivity_method:
    name: reactivity_method
    description: 'The methodology used to assess/classify reactivity. This should be either the assay utlizied in the experiment, delineated as "annotated" if annotated from an external source (e.g. IEDB), or inferred if imputed using a computational method. In future versions we anticipate this field being an enumerated type, and it is strongly recommended that users utilize one of the following keywords in this field if appropriate: native_protein, MHC_peptide_multimer, annotated, inferred.'
    range: string
    annotations:
      nullable: false
  reactivity_readout:
    name: reactivity_readout
    description: 'Reactivity measurement read-out. For physical assays, this should describe what was measured. For inferred and annotated methods this should indicate a confidence/quality level for the inference/annotation. In future versions we anticipate this field being an enumerated type, and it is strongly recommended that users utilize one of the following keywords in this field if appropriate: fluorescence_intensity, barcode_count, confidence.'
    range: string
    annotations:
      nullable: false
  reactivity_value:
    name: reactivity_value
    description: The absolute (processed) value of the measurement
    range: float
    annotations:
      nullable: false
  reactivity_unit:
    name: reactivity_unit
    description: The unit of the measurement
    range: string
    annotations:
      nullable: false
  reactivity_refs:
    name: reactivity_refs
    description: Array of cross references to external epitope reactivity records
    range: string
    multivalued: true
    annotations:
      nullable: true

