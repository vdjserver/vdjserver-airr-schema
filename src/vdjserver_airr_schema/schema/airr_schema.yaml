slots:
  time_label:
    name: time_label
    description: Informative label for the time point
    range: string
  time_value:
    name: time_value
    description: Value of the time point
    range: float
    annotations:
      nullable: false
  time_unit:
    name: time_unit
    range: TimeUnitOntology
    annotations:
      nullable: false
  time_min:
    name: time_min
    description: Lower/minimum value of the time interval
    range: float
    annotations:
      nullable: false
  time_max:
    name: time_max
    description: Upper/maximum value of the time interval
    range: float
    annotations:
      nullable: false
  physical_quantity:
    name: physical_quantity
    description: Physical quantity
    range: float
    annotations:
      nullable: false
  physical_unit:
    name: physical_unit
    description: Unit of physical quantity
    range: PhysicalUnitOntology
    annotations:
      nullable: false
  time_quantity:
    name: time_quantity
    description: Time quantity
    range: float
    annotations:
      nullable: false
  contributor_id:
    name: contributor_id
    description: Unique identifier of this contributor within the file
    range: string
    annotations:
      nullable: true
  name:
    name: name
    description: Full name of contributor
    range: string
    annotations:
      nullable: false
  orcid_id:
    name: orcid_id
    description: ORCID identifier of the contributor. Note that if present, the label of the ORCID record should take precedence over the name reported in the `name` property.
    range: string
    annotations:
      nullable: true
  affiliation:
    name: affiliation
    description: ROR of the contributor's primary affiliation. Note that ROR are only minted for institutions, not from individuals institutes, divisions or departments.
    range: string
    annotations:
      nullable: true
  affiliation_department:
    name: affiliation_department
    description: Additional information regarding the contributor's primary affiliation. Can be used to specify individual institutes, divisions or departments.
    range: string
    annotations:
      nullable: true
  contributions:
    name: contributions
    description: List of all roles the contributor had in a project
    range: ContributorContribution
    multivalued: true
    annotations:
      nullable: true
  role:
    name: role
    description: Role according to CRediT taxonomy
    range: RoleEnum
    annotations:
      nullable: false
  degree:
    name: degree
    description: Optional specification of the degree of contribution, should be used if multiple individuals serve the same role.
    range: DegreeEnum
    annotations:
      nullable: true
  sequence_id:
    name: sequence_id
    range: string
  sequence:
    name: sequence
    range: string
  derivation:
    name: derivation
    description: The class of nucleic acid that was used as primary starting material
    range: DerivationEnum
    annotations:
      nullable: true
  observation_type:
    name: observation_type
    description: The type of observation from which this sequence was drawn, such as direct sequencing or  inference from repertoire sequencing data.
    slot_uri: rdf:type
    range: ObservationTypeEnum
    annotations:
      nullable: false
  curation:
    name: curation
    range: string
  repository_name:
    name: repository_name
    range: string
  repository_ref:
    name: repository_ref
    description: Queryable id or accession number of the sequence published by the repository
    range: string
  deposited_version:
    name: deposited_version
    description: Version number of the sequence within the repository
    range: string
  sequence_start:
    name: sequence_start
    description: Start co-ordinate of the sequence detailed in this record, within the sequence deposited
    range: integer
    annotations:
      nullable: false
  sequence_end:
    name: sequence_end
    description: End co-ordinate of the sequence detailed in this record, within the sequence deposited
    range: integer
    annotations:
      nullable: false
  patch_no:
    name: patch_no
    description: Genome assembly patch number in which this gene was determined
    range: string
  gff_seqid:
    name: gff_seqid
    description: Sequence (from the assembly) of a window including the gene and preferably also the promoter region.
    range: string
  gff_start:
    name: gff_start
    description: Genomic co-ordinates of the start of the sequence of interest described in this record in  Ensemble GFF version 3.
    range: integer
  gff_end:
    name: gff_end
    description: Genomic co-ordinates of the end of the sequence of interest described in this record in  Ensemble GFF version 3.
    range: integer
  strand:
    name: strand
    description: sense (+ or -)
    range: StrandEnum
    annotations:
      nullable: true
  sequence_delineation_id:
    name: sequence_delineation_id
    description: Unique identifier of this SequenceDelineationV within the file. Typically, generated by the  repository hosting the record.
    range: string
  delineation_scheme:
    name: delineation_scheme
    description: Name of the delineation scheme
    range: string
  unaligned_sequence:
    name: unaligned_sequence
    description: entire V-sequence covered by this delineation
    range: string
  aligned_sequence:
    name: aligned_sequence
    description: Aligned sequence if this delineation provides an alignment. An aligned sequence should always be  provided for IMGT delineations.
    range: string
  fwr1_start:
    name: fwr1_start
    range: integer
  fwr1_end:
    name: fwr1_end
    range: integer
  cdr1_start:
    name: cdr1_start
    range: integer
  cdr1_end:
    name: cdr1_end
    range: integer
  fwr2_start:
    name: fwr2_start
    range: integer
  fwr2_end:
    name: fwr2_end
    range: integer
  cdr2_start:
    name: cdr2_start
    range: integer
  cdr2_end:
    name: cdr2_end
    range: integer
  fwr3_start:
    name: fwr3_start
    range: integer
  fwr3_end:
    name: fwr3_end
    range: integer
  cdr3_start:
    name: cdr3_start
    range: integer
  alignment_labels:
    name: alignment_labels
    description: One string for each codon in the aligned_sequence indicating the label of that codon according to  the numbering of the delineation scheme if it provides one.
    range: string
    multivalued: true
  allele_description_id:
    name: allele_description_id
    description: Unique identifier of this AlleleDescription within the file. Typically, generated by the  repository hosting the record.
    range: string
  allele_description_ref:
    name: allele_description_ref
    description: Unique reference to the allele description, in standardized form (Repo:Label:Version)
    range: string
  acknowledgements:
    name: acknowledgements
    range: Contributor
    multivalued: true
  release_version:
    name: release_version
    range: integer
  release_date:
    name: release_date
    description: Date of this release
    range: datetime
  release_description:
    name: release_description
    description: Brief descriptive notes of the reason for this release and the changes embodied
    range: string
  label:
    name: label
    range: string
  coding_sequence:
    name: coding_sequence
    description: Nucleotide sequence of the core coding region, such as the coding region of a D-, J- or C- gene  or the coding region of a V-gene excluding the leader.
    range: string
  aliases:
    name: aliases
    description: Alternative names for this sequence
    range: string
    multivalued: true
  locus:
    name: locus
    range: LocusEnum
  chromosome:
    name: chromosome
    description: chromosome on which the gene is located
    range: integer
  sequence_type:
    name: sequence_type
    description: Sequence type (V, D, J, C)
    slot_uri: rdf:type
    range: SequenceTypeEnum
    annotations:
      nullable: false
  functional:
    name: functional
    description: True if the gene is functional, false if it is a pseudogene
    range: boolean
  inference_type:
    name: inference_type
